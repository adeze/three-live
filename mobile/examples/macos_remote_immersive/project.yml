name: ThreeLiveRemoteImmersive

options:
  bundleIdPrefix: com.google.threelive
  deploymentTarget:
    macOS: '27.0'

packages:
  ThreeLiveCompiler:
    path: ../../..

targets:
  ThreeLiveRemoteImmersive:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../ios_swiftui/SampleScenes.swift
    dependencies:
      - package: ThreeLiveCompiler
        product: ThreeLiveCompiler
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Three-Live Remote Immersive
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '1'
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.threelive.remoteimmersive
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
